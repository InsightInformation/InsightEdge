[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quill-writer"
version = "0.1.0"
description = "A personal writing agent powered by Claude that learns and writes in your voice."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["anthropic>=1.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
quill = "quill.cli:main"

[tool.setuptools]
packages = ["quill"]

[tool.setuptools.package-data]
quill = ["static/*.html"]
